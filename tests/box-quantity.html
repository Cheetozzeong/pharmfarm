<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>박스 수량 입력 디자인 검증</title><link rel="stylesheet" href="/src/styles.css"><style>
body {display:block;min-height:100vh;background:#edf0f3;}
.fixture-phone {width: min(var(--fixture-width, 390px), 100%);margin:24px auto;background:#fff;min-height:760px;padding:0 0 20px;box-shadow:0 12px 40px #15243b10;}
.fixture-header {display:flex;align-items:center;gap:14px;padding:22px 20px;border-bottom:1px solid #edf0f3;font-size:19px;font-weight:800;}
.fixture-body {padding:16px 20px;}
.fixture-footer {padding:16px 20px;border-top:1px solid #edf0f3;}
.fixture-footer button {width:100%;}
.fixture-note {margin:0 0 14px;font-size:12px;color:#728093;}
</style></head><body><div id="root"></div><script type="module">
import React, {useState} from 'react';import {createRoot} from 'react-dom/client';
import {BoxReceiptQuantity} from '/src/BoxReceiptQuantity.tsx';
import {ArrowLeft} from 'lucide-react';
const params=new URLSearchParams(location.search);
const saved=params.get('saved')==='1';
const base=Number(params.get('base')||1);
const width=Number(params.get('width')||390);
function Fixture(){
 const [drug,setDrug]=useState({boxPackage:true,baseProductTotalQuantity:base,boxPackageCount:saved?24:undefined,boxMappingRevision:saved?1:0,productTotalQuantity:saved?24*base:0,boxQuantityConfirmed:false});
 const issue=!drug.boxQuantityConfirmed;
 function selectQuantity(id,count,confirmed=false){setDrug(current=>({...current,boxPackageCount:count,productTotalQuantity:Number.isInteger(count)&&count>0&&count<=10000?count*base:0,boxQuantityConfirmed:confirmed&&Number.isInteger(count)&&count>=1&&count<=10000}));}
 return React.createElement('main',{className:'fixture-phone',style:{'--fixture-width':width+'px'}},
  React.createElement('header',{className:'fixture-header'},React.createElement(ArrowLeft,{size:23}),'매칭 결과'),
  React.createElement('div',{className:'fixture-body'},
   React.createElement('p',{className:'fixture-note'},'스캔한 약품과 입고 수량을 확인해 주세요.'),
   React.createElement('section',{className:'receipt-step-panel'},
    React.createElement('div',{className:'receipt-fix-card'},
     React.createElement('div',{className:'receipt-fix-head'},React.createElement('div',null,React.createElement('strong',null,'엔커버액 200mL 커피맛'),React.createElement('span',null,'보험코드 644912233')),React.createElement('span',{className:'badge normal'},'일치')),
     React.createElement(BoxReceiptQuantity,{item:{id:'fixture',drug},onSelectQuantity:selectQuantity})
    )
   )
  ),
  React.createElement('footer',{className:'fixture-footer'},React.createElement('button',{className:'primary-btn',disabled:issue,onClick:()=>document.getElementById('result').textContent='테스트 화면: 입고 요청은 전송하지 않습니다.'},'1건 입고 확정'),React.createElement('p',{id:'result',className:'fixture-note'}))
 );
}
createRoot(document.getElementById('root')).render(React.createElement(Fixture));
</script></body></html>
