<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent diagnostics dialog regression fixture</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useState } from "react";
      import { createRoot } from "react-dom/client";
      import { AgentDiagnosticsDialog } from "/src/AgentDiagnosticsDialog.tsx";

      const report = {
        schemaVersion: 1,
        privacy: "STRUCTURED_ALLOWLIST",
        agentVersion: "1.4.8-ps",
        counts: {
          queue: 3,
          "dead-letter": 1,
          "ui-alerts": 0,
          "ui-alerts-failed": 0,
        },
        runtime: ["agent", "tray", "supervisor"].map((role) => ({
          role,
          running: true,
          paused: false,
          progressAgeSeconds: 4,
        })),
        files: [
          {
            name: "agent-20261007.log",
            entries: Array.from({ length: 500 }, () => ({
              at: "2026-10-07T10:00:00+09:00",
              event: "WATCH_SCAN",
              issue: "NONE",
              metrics: { rows: 32 },
              fixtureLongLine: "x".repeat(600),
            })),
          },
        ],
      };

      function Fixture() {
        const [mode, setMode] = useState("");
        return React.createElement(
          "main",
          { style: { padding: 24, minHeight: "200vh" } },
          React.createElement("h1", null, "진단 모달 회귀 검증"),
          ...["대용량 로그 열기", "조회 중 로그 열기", "오류 로그 열기"].map(
            (label) =>
              React.createElement(
                "button",
                { key: label, onClick: () => setMode(label) },
                label,
              ),
          ),
          mode &&
            React.createElement(AgentDiagnosticsDialog, {
              report: mode === "대용량 로그 열기" ? report : null,
              loading: mode === "조회 중 로그 열기",
              message:
                mode === "오류 로그 열기"
                  ? "진단 로그를 불러오지 못했습니다."
                  : mode === "조회 중 로그 열기"
                    ? "진단 로그를 불러오고 있습니다."
                    : "개인정보를 제외한 진단 결과입니다.",
              onClose: () => setMode(""),
              onDownload: () => {},
            }),
        );
      }
      createRoot(document.getElementById("root")).render(
        React.createElement(Fixture),
      );
    </script>
  </body>
</html>
