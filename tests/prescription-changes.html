<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>변동 처방 디자인 검증</title><link rel="stylesheet" href="/src/styles.css"><style>
body {display:block;padding:0;background:#f7f9fc;}#root {display:flex;flex-direction:column;height:100dvh;min-width:0;} .fixture-global-header {display:flex;flex:0 0 58px;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #e1e7ef;background:white;font-size:15px;font-weight:700;} .fixture-global-header small {font-size:11px;color:#98a2b0;font-weight:400;}
@media(max-width:900px){#root{height:auto;min-height:100dvh}.fixture-global-header{padding:18px;}}
</style></head><body><div id="root"></div><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';
import {PrescriptionChangePage} from '/src/PrescriptionChanges.tsx';
const params=new URLSearchParams(location.search),blocked=params.get('state')==='blocked',limited=params.get('state')==='limited';
const rowCount=Number(params.get('rows')||3);
const line={lineNo:'1',insuranceCode:'640007761',drugName:'검증용 약품 A',dose:'1',daily:'2',days:60,quantity:120,totalQuantity:'120',substitutionType:0};
const unchanged=Array.from({length:24},(_,i)=>({...line,lineNo:String(i+2),insuranceCode:String(641000000+i),drugName:`변경 없는 약품 ${i+1}`}));
const before=[line,...unchanged],after=[{...line,days:40,quantity:80,totalQuantity:'80'},...unchanged];
if(params.get('alignment')==='1') {
 before[0]={...before[0],drugName:'검증용 아주 긴 약품명 · 이름이 여러 줄로 표시되는 경우의 취소 내역',quantity:12345,totalQuantity:'12345'};
 before[1]={...before[1],drugName:'짧은 약품',quantity:2,totalQuantity:'2'};
 before[2]={...before[2],drugName:'길이가 다른 검증용 약품 이름',quantity:120000,totalQuantity:'120000'};
}
const records=Array.from({length:rowCount},(_,i)=>({id:i+1,pharmacyId:4,prescriptionCode:`2026102900${String(i+1).padStart(2,'0')}`,status:i===1&&rowCount===3?'AUTO_APPLIED':'PENDING',reason:'이미 차감한 수량보다 처방이 줄어 재고 반환 확인이 필요합니다.',cancellation:rowCount===3&&i===2,before,after:rowCount===3&&i===2?[]:after,capturedAt:'2026-11-02T11:00:00',createdAt:'2026-11-02T11:00:00'}));
window.fixtureDecisions=[];
async function request(path,options){
 if(options?.method==='POST'){
  const body=JSON.parse(options.body);window.fixtureDecisions.push(body);
  const id=Number(path.split('/')[2]);const record=records.find(r=>r.id===id);record.status=body.action==='APPROVE'?'APPROVED':'REJECTED';record.memo=body.memo;record.decidedAt='2026-11-02T11:30:00';return {data:record};
 }
 const match=path.match(/^\/prescription-changes\/(\d+)$/);
 if(match){const record=records.find(r=>r.id===Number(match[1]));return {data:{...record,current:record.before,processing:[{line_no:'1',insurance_code:line.insuranceCode,deducted_quantity:96,substitute_quantity:0,shortage_quantity:24,shortage_status:'ORDERED'}],stockEffects:record.status==='PENDING'?[{stockId:10,drugName:line.drugName,insuranceCode:line.insuranceCode,beforeQuantity:12,returnQuantity:record.cancellation?96:16,afterQuantity:record.cancellation?108:28,blocked}]:[],canApprove:!blocked,reviewToken:'fixture-only'}};}
 const query=new URL('https://fixture.invalid'+path).searchParams;
 const rows=records.filter(r=>query.get('status')==='ALL'||r.status===query.get('status'));
 const page=Number(query.get('page')||0);return {data:{items:rows.slice(page*50,page*50+50),total:rows.length,size:50}};
}
createRoot(document.getElementById('root')).render(React.createElement(React.Fragment,null,React.createElement('header',{className:'fixture-global-header'},'처방전',React.createElement('small',null,'검증 화면 · 실제 처방 및 재고 변경 없음')),React.createElement(PrescriptionChangePage,{request,root:false,limited})));
</script></body></html>
