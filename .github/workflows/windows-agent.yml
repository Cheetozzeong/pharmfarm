name: Windows agent verification
on:
  push:
    branches: [main, 'codex/agent-supervisor-*']
    paths: ['windows-agent-production/**', 'tests/windows-agent*', 'scripts/build-agent-host.ps1', '.github/workflows/windows-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Native supervisor policy
        run: '& ./tests/windows-agent-supervisor.Tests.ps1'
      - name: Heartbeat and queue compatibility
        if: ${{ !cancelled() }}
        run: |
          & ./tests/windows-agent-heartbeat.Tests.ps1
          & ./tests/windows-agent-queue.Tests.ps1
      - name: Repair rollback transaction
        if: ${{ !cancelled() }}
        run: '& ./tests/windows-agent-update.Tests.ps1'
      - name: CMS remote update
        if: ${{ !cancelled() }}
        run: '& ./tests/windows-agent-remote-update.Tests.ps1'
      - name: Tray and windowless policy
        if: ${{ !cancelled() }}
        run: |
          & ./tests/windows-agent-tray.Tests.ps1
          & ./tests/windows-agent-windowless.Tests.ps1
      - name: Real stock alert visibility and message loop
        if: ${{ !cancelled() }}
        run: '& ./tests/windows-agent-stock-alert-integration.Tests.ps1'
      - name: Native host lifetime and no-window checks
        if: ${{ !cancelled() }}
        run: '& ./tests/windows-agent-host-integration.Tests.ps1'
      - name: Independent supervisor and real Scheduler breakaway
        if: ${{ !cancelled() }}
        run: '& ./tests/windows-agent-supervisor-integration.Tests.ps1'
